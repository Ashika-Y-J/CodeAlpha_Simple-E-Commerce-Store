<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | ShopSphere</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <div class="header-main">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon"><i class="fa-solid fa-shapes"></i></div>
          <span>Shop<span class="sphere">Sphere</span></span>
        </a>
        <div class="header-actions" style="margin-left: auto;">
          <a href="index.html" class="action-link"><i class="fa-solid fa-house"></i> Home</a>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="auth-wrapper">
        <div class="auth-card">
          
          <div class="auth-header">
            <div class="brand-icon" style="width: 46px; height: 46px; font-size: 1.35rem; margin: 0 auto 1rem;">
              <i class="fa-solid fa-shapes"></i>
            </div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to your ShopSphere account</p>
          </div>

          <!-- Demo Accounts Auto-fill Box -->
          <div class="demo-credentials-box">
            <div style="font-weight: 700; color: var(--gray-900); margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.4rem;">
              <i class="fa-solid fa-key" style="color: var(--primary);"></i> Quick Demo Credentials:
            </div>
            <div style="display: flex; justify-content: space-between; gap: 0.5rem; margin-top: 0.5rem;">
              <button type="button" class="btn btn-outline btn-sm" style="flex: 1; font-size: 0.775rem; padding: 0.35rem;" onclick="fillDemo('customer', 'customer123')">
                <i class="fa-solid fa-user"></i> Fill Customer
              </button>
              <button type="button" class="btn btn-outline btn-sm" style="flex: 1; font-size: 0.775rem; padding: 0.35rem;" onclick="fillDemo('admin', 'admin123')">
                <i class="fa-solid fa-user-shield"></i> Fill Admin
              </button>
            </div>
          </div>

          <form id="login-form">
            <div class="form-group">
              <label class="form-label">Username or Email</label>
              <input type="text" id="login-username" class="form-input" placeholder="e.g. customer" required>
            </div>

            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
              <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
            </button>
          </form>

          <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--gray-200); font-size: 0.9rem; color: var(--gray-600);">
            Don't have an account yet? 
            <a href="register.html" style="color: var(--primary); font-weight: 700;">Create Account</a>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    function fillDemo(user, pass) {
      document.getElementById('login-username').value = user;
      document.getElementById('login-password').value = pass;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';

      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      try {
        const res = await API.login(username, password);
        showToast(res.message || 'Logged in successfully!', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      } catch (err) {
        showToast(err.message || 'Invalid username or password', 'danger');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In';
      }
    });
  </script>
</body>
</html>
