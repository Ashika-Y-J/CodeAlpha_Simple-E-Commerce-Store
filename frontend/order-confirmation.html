<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed | ShopSphere</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <div class="header-main">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon"><i class="fa-solid fa-shapes"></i></div>
          <span>Shop<span class="sphere">Sphere</span></span>
        </a>
        <div class="header-actions" style="margin-left: auto;">
          <a href="index.html" class="action-link"><i class="fa-solid fa-house"></i> Home</a>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="container" id="order-container" style="padding: 2rem 0 4rem;">
      <div style="text-align: center; padding: 4rem;">
        <i class="fa-solid fa-spinner fa-spin" style="font-size: 2.5rem; color: var(--primary);"></i>
        <p style="margin-top: 1rem; color: var(--gray-500);">Retrieving order details...</p>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const orderNumber = urlParams.get('order');

      const container = document.getElementById('order-container');

      if (!orderNumber) {
        container.innerHTML = `
          <div class="confirmation-card">
            <h2>No Order Found</h2>
            <p>Please browse products to place a new order.</p>
            <a href="products.html" class="btn btn-primary" style="margin-top: 1rem;">Go to Catalog</a>
          </div>
        `;
        return;
      }

      try {
        const order = await API.getOrder(orderNumber);
        container.innerHTML = `
          <div class="confirmation-card">
            <div class="success-icon-wrap"><i class="fa-solid fa-check"></i></div>
            <h1 style="font-size: 2.25rem; font-weight: 800; color: var(--gray-900); margin-bottom: 0.5rem;">
              Thank You for Your Order!
            </h1>
            <p style="color: var(--gray-600); font-size: 1.05rem; max-width: 500px; margin: 0 auto 1.5rem;">
              We've received your order and are preparing it for shipment. Reference code:
            </p>
            <div style="display: inline-block; background: var(--primary-light); color: var(--primary); padding: 0.5rem 1.25rem; border-radius: var(--radius-full); font-weight: 800; font-size: 1.1rem; letter-spacing: 0.05em; margin-bottom: 2rem;">
              #${order.order_number}
            </div>

            <!-- Timeline -->
            <div class="order-timeline">
              <div class="timeline-step completed">
                <div class="timeline-dot"><i class="fa-solid fa-check"></i></div>
                <span class="timeline-label">Order Placed</span>
              </div>
              <div class="timeline-step completed">
                <div class="timeline-dot"><i class="fa-solid fa-check"></i></div>
                <span class="timeline-label">Confirmed</span>
              </div>
              <div class="timeline-step">
                <div class="timeline-dot"><i class="fa-solid fa-box"></i></div>
                <span class="timeline-label">Processing</span>
              </div>
              <div class="timeline-step">
                <div class="timeline-dot"><i class="fa-solid fa-truck"></i></div>
                <span class="timeline-label">Delivered</span>
              </div>
            </div>

            <!-- Details Box -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; text-align: left; margin: 2rem 0; background: var(--gray-50); padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--gray-200);">
              <div>
                <h4 style="font-size: 0.85rem; font-weight: 700; color: var(--gray-500); text-transform: uppercase; margin-bottom: 0.5rem;">Shipping Address:</h4>
                <div style="font-weight: 700; color: var(--gray-800);">${order.first_name} ${order.last_name}</div>
                <div style="font-size: 0.9rem; color: var(--gray-600);">${order.address_line1}</div>
                ${order.address_line2 ? `<div style="font-size: 0.9rem; color: var(--gray-600);">${order.address_line2}</div>` : ''}
                <div style="font-size: 0.9rem; color: var(--gray-600);">${order.city}, ${order.state} ${order.postal_code}</div>
                <div style="font-size: 0.9rem; color: var(--gray-600);">${order.country}</div>
                <div style="font-size: 0.85rem; color: var(--gray-500); margin-top: 0.35rem;"><i class="fa-solid fa-phone"></i> ${order.phone}</div>
              </div>

              <div>
                <h4 style="font-size: 0.85rem; font-weight: 700; color: var(--gray-500); text-transform: uppercase; margin-bottom: 0.5rem;">Order Information:</h4>
                <div style="font-size: 0.9rem; color: var(--gray-700); margin-bottom: 0.35rem;">
                  <strong>Date:</strong> ${new Date(order.created_at || Date.now()).toLocaleDateString()}
                </div>
                <div style="font-size: 0.9rem; color: var(--gray-700); margin-bottom: 0.35rem;">
                  <strong>Method:</strong> ${order.payment_method_display || order.payment_method}
                </div>
                <div style="font-size: 0.9rem; color: var(--gray-700); margin-bottom: 0.35rem;">
                  <strong>Status:</strong> 
                  <span style="display: inline-block; padding: 0.15rem 0.6rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; background: var(--success-light); color: #065f46;">
                    ${order.payment_status}
                  </span>
                </div>
              </div>
            </div>

            <!-- Items Table -->
            <div style="text-align: left; margin-bottom: 2rem;">
              <h3 style="font-size: 1.15rem; font-weight: 800; color: var(--gray-900); margin-bottom: 1rem;">Items Summary</h3>
              <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem;">
                <thead>
                  <tr style="border-bottom: 2px solid var(--gray-200); text-align: left; color: var(--gray-500); font-size: 0.8rem; text-transform: uppercase;">
                    <th style="padding-bottom: 0.5rem;">Item</th>
                    <th style="padding-bottom: 0.5rem; text-align: center;">Qty</th>
                    <th style="padding-bottom: 0.5rem; text-align: right;">Price</th>
                    <th style="padding-bottom: 0.5rem; text-align: right;">Total</th>
                  </tr>
                </thead>
                <tbody>
                  ${(order.items || []).map(it => `
                    <tr style="border-bottom: 1px solid var(--gray-100);">
                      <td style="padding: 0.75rem 0; display: flex; align-items: center; gap: 0.75rem;">
                        ${it.product_image ? `<img src="${it.product_image}" style="width: 44px; height: 44px; border-radius: var(--radius-sm); object-fit: cover;">` : ''}
                        <span style="font-weight: 600; color: var(--gray-800);">${it.product_name}</span>
                      </td>
                      <td style="text-align: center; color: var(--gray-600);">${it.quantity}</td>
                      <td style="text-align: right; color: var(--gray-600);">$${it.price}</td>
                      <td style="text-align: right; font-weight: 700; color: var(--gray-900);">$${it.total_price}</td>
                    </tr>
                  `).join('')}
                </tbody>
                <tfoot>
                  <tr>
                    <td colspan="3" style="text-align: right; padding-top: 1rem; color: var(--gray-600);">Subtotal:</td>
                    <td style="text-align: right; padding-top: 1rem; font-weight: 600;">$${order.subtotal}</td>
                  </tr>
                  <tr>
                    <td colspan="3" style="text-align: right; padding-top: 0.35rem; color: var(--gray-600);">Shipping:</td>
                    <td style="text-align: right; padding-top: 0.35rem; font-weight: 600;">
                      ${parseFloat(order.shipping_cost) === 0 ? 'FREE' : '$' + order.shipping_cost}
                    </td>
                  </tr>
                  <tr>
                    <td colspan="3" style="text-align: right; padding-top: 0.35rem; color: var(--gray-600);">Tax:</td>
                    <td style="text-align: right; padding-top: 0.35rem; font-weight: 600;">$${order.tax_amount}</td>
                  </tr>
                  <tr style="font-size: 1.15rem; font-weight: 800; color: var(--gray-900);">
                    <td colspan="3" style="text-align: right; padding-top: 0.75rem; border-top: 1px solid var(--gray-200);">Total:</td>
                    <td style="text-align: right; padding-top: 0.75rem; border-top: 1px solid var(--gray-200); color: var(--primary);">$${order.total_amount}</td>
                  </tr>
                </tfoot>
              </table>
            </div>

            <!-- Action Buttons -->
            <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
              <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-arrow-left"></i> Return Home</a>
              <button type="button" onclick="window.print()" class="btn btn-outline"><i class="fa-solid fa-print"></i> Print Receipt</button>
            </div>
          </div>
        `;
      } catch (e) {
        container.innerHTML = `
          <div class="confirmation-card">
            <h2>Order Details Unavailable</h2>
            <p>Could not load details for order #${orderNumber}.</p>
            <a href="index.html" class="btn btn-primary" style="margin-top: 1rem;">Return Home</a>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
