<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Profile | ShopSphere</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <div class="header-main">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon"><i class="fa-solid fa-shapes"></i></div>
          <span>Shop<span class="sphere">Sphere</span></span>
        </a>
        <div class="header-actions" style="margin-left: auto;">
          <a href="index.html" class="action-link"><i class="fa-solid fa-house"></i> Home</a>
          <a href="cart.html" class="action-link" title="Shopping Cart">
            <i class="fa-solid fa-bag-shopping"></i>
            <span class="badge-counter cart-badge">0</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="container" style="padding-top: 2rem; padding-bottom: 4rem;">
      <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2rem; font-weight: 800; color: var(--gray-900);">My Account</h1>
        <span style="color: var(--gray-500); font-size: 0.95rem;">Manage your shipping address and past orders.</span>
      </div>

      <div style="display: grid; grid-template-columns: 320px 1fr; gap: 2rem;">
        
        <!-- Left: User Summary Card -->
        <div>
          <div style="background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: 2rem; text-align: center; box-shadow: var(--shadow-sm);">
            <div id="profile-avatar" style="width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary) 0%, #818cf8 100%); color: var(--white); border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800; margin: 0 auto 1.25rem;">
              U
            </div>
            <h3 id="profile-display-name" style="font-size: 1.25rem; font-weight: 800; color: var(--gray-900); margin-bottom: 0.25rem;">Customer</h3>
            <span id="profile-display-user" style="color: var(--gray-500); font-size: 0.85rem;">@customer</span>

            <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--gray-100); text-align: left; font-size: 0.875rem;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                <span style="color: var(--gray-500);">Email:</span>
                <span id="profile-display-email" style="font-weight: 600; color: var(--gray-800);">customer@example.com</span>
              </div>
              <div style="display: flex; justify-content: space-between;">
                <span style="color: var(--gray-500);">Status:</span>
                <span style="color: var(--success); font-weight: 700;">Active Customer</span>
              </div>
            </div>

            <div style="margin-top: 1.5rem;">
              <button type="button" id="profile-signout-btn" class="btn btn-outline btn-block btn-sm" style="color: var(--danger); border-color: var(--danger-light);">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
              </button>
            </div>
          </div>
        </div>

        <!-- Right: Profile Form & Orders List -->
        <div>
          <!-- Edit Form -->
          <div style="background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: 2rem; margin-bottom: 2rem; box-shadow: var(--shadow-sm);">
            <h3 style="font-size: 1.25rem; font-weight: 800; color: var(--gray-900); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
              <i class="fa-regular fa-id-card" style="color: var(--primary);"></i> Shipping Address & Info
            </h3>

            <form id="profile-form">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">First Name</label>
                  <input type="text" id="prof-fname" class="form-input">
                </div>
                <div class="form-group">
                  <label class="form-label">Last Name</label>
                  <input type="text" id="prof-lname" class="form-input">
                </div>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Email Address</label>
                  <input type="email" id="prof-email" class="form-input">
                </div>
                <div class="form-group">
                  <label class="form-label">Phone Number</label>
                  <input type="text" id="prof-phone" class="form-input">
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Default Shipping Street Address</label>
                <input type="text" id="prof-address" class="form-input">
              </div>

              <div class="form-row" style="grid-template-columns: 2fr 1fr 1fr;">
                <div class="form-group">
                  <label class="form-label">City</label>
                  <input type="text" id="prof-city" class="form-input">
                </div>
                <div class="form-group">
                  <label class="form-label">State</label>
                  <input type="text" id="prof-state" class="form-input">
                </div>
                <div class="form-group">
                  <label class="form-label">Postal Code</label>
                  <input type="text" id="prof-zip" class="form-input">
                </div>
              </div>

              <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-floppy-disk"></i> Save Profile Details
              </button>
            </form>
          </div>

          <!-- Orders History -->
          <div id="orders" style="background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: 2rem; box-shadow: var(--shadow-sm);">
            <h3 style="font-size: 1.25rem; font-weight: 800; color: var(--gray-900); margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem;">
              <i class="fa-solid fa-box-open" style="color: var(--primary);"></i> Order History
            </h3>

            <div id="profile-orders-list">
              <p style="color: var(--gray-500); font-size: 0.9rem;">Loading orders...</p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      let user = API.getAuthUser();
      if (!user) {
        user = {
          username: 'customer',
          first_name: 'Alex',
          last_name: 'Morgan',
          email: 'customer@example.com',
          phone: '+1 (555) 234-5678',
          address: '742 Evergreen Terrace',
          city: 'Springfield',
          state: 'OR',
          postal_code: '97477',
          country: 'United States'
        };
      }

      document.getElementById('profile-avatar').textContent = (user.first_name || user.username).charAt(0).toUpperCase();
      document.getElementById('profile-display-name').textContent = `${user.first_name || ''} ${user.last_name || ''}`.trim() || user.username;
      document.getElementById('profile-display-user').textContent = `@${user.username}`;
      document.getElementById('profile-display-email').textContent = user.email;

      document.getElementById('prof-fname').value = user.first_name || '';
      document.getElementById('prof-lname').value = user.last_name || '';
      document.getElementById('prof-email').value = user.email || '';
      document.getElementById('prof-phone').value = user.phone || '';
      document.getElementById('prof-address').value = user.address || '';
      document.getElementById('prof-city').value = user.city || '';
      document.getElementById('prof-state').value = user.state || '';
      document.getElementById('prof-zip').value = user.postal_code || '';

      document.getElementById('profile-signout-btn').addEventListener('click', () => {
        API.logout();
        showToast('Logged out', 'info');
        setTimeout(() => window.location.href = 'index.html', 500);
      });

      document.getElementById('profile-form').addEventListener('submit', (e) => {
        e.preventDefault();
        user.first_name = document.getElementById('prof-fname').value;
        user.last_name = document.getElementById('prof-lname').value;
        user.email = document.getElementById('prof-email').value;
        user.phone = document.getElementById('prof-phone').value;
        user.address = document.getElementById('prof-address').value;
        user.city = document.getElementById('prof-city').value;
        user.state = document.getElementById('prof-state').value;
        user.postal_code = document.getElementById('prof-zip').value;
        API.setAuthUser(user);
        showToast('Profile updated successfully!', 'success');
      });

      // Load Orders
      const recentOrders = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEYS.RECENT_ORDERS) || '[]');
      const ordersContainer = document.getElementById('profile-orders-list');

      if (recentOrders.length > 0) {
        ordersContainer.innerHTML = `
          <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; font-size: 0.9rem;">
              <thead>
                <tr style="border-bottom: 2px solid var(--gray-200); text-align: left; color: var(--gray-500); font-size: 0.8rem; text-transform: uppercase;">
                  <th style="padding-bottom: 0.65rem;">Order #</th>
                  <th style="padding-bottom: 0.65rem;">Date</th>
                  <th style="padding-bottom: 0.65rem;">Total</th>
                  <th style="padding-bottom: 0.65rem;">Status</th>
                  <th style="padding-bottom: 0.65rem; text-align: right;">Action</th>
                </tr>
              </thead>
              <tbody>
                ${recentOrders.map(o => `
                  <tr style="border-bottom: 1px solid var(--gray-100);">
                    <td style="padding: 0.85rem 0; font-weight: 700; color: var(--primary);">#${o.order_number}</td>
                    <td style="color: var(--gray-600);">${new Date(o.created_at || Date.now()).toLocaleDateString()}</td>
                    <td style="font-weight: 700; color: var(--gray-900);">$${o.total_amount}</td>
                    <td>
                      <span style="display: inline-block; padding: 0.2rem 0.65rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; background: var(--success-light); color: #065f46;">
                        ${o.order_status || 'Confirmed'}
                      </span>
                    </td>
                    <td style="text-align: right;">
                      <a href="order-confirmation.html?order=${o.order_number}" class="btn btn-outline btn-sm">View</a>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      } else {
        ordersContainer.innerHTML = `
          <p style="color: var(--gray-500); font-size: 0.9rem;">You have no recorded orders yet.</p>
          <a href="products.html" class="btn btn-outline btn-sm" style="margin-top: 0.75rem;">Browse Catalog</a>
        `;
      }
    });
  </script>
</body>
</html>
