<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | ShopSphere</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Announcement Bar -->
  <div class="announcement-bar">
    <div class="container">
      <span>🚀 Flash Sale: Use code <span class="highlight">SPHERE20</span> for 20% off all orders over $50! | Free Express Shipping</span>
    </div>
  </div>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <div class="header-main">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon"><i class="fa-solid fa-shapes"></i></div>
          <span>Shop<span class="sphere">Sphere</span></span>
        </a>

        <!-- Search Form -->
        <div class="header-search">
          <form action="products.html" method="GET" class="search-form">
            <select name="category" id="nav-search-category" class="search-category-select">
              <option value="">All Categories</option>
            </select>
            <input type="text" name="q" class="search-input" placeholder="Search for electronics, fashion, headphones..." required>
            <button type="submit" class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
          </form>
        </div>

        <!-- Actions -->
        <div class="header-actions">
          <div id="navbar-auth-section">
            <a href="login.html" class="action-link"><i class="fa-regular fa-user"></i><span>Sign In</span></a>
          </div>
          <a href="cart.html" class="action-link" title="Shopping Cart">
            <i class="fa-solid fa-bag-shopping"></i>
            <span class="badge-counter cart-badge">0</span>
          </a>
          <button class="mobile-menu-toggle"><i class="fa-solid fa-bars"></i></button>
        </div>
      </div>
    </div>

    <!-- Category Nav Strip -->
    <nav class="category-nav">
      <div class="container">
        <div class="category-nav-inner" id="category-nav-items"></div>
      </div>
    </nav>
  </header>

  <main>
    <div class="container" style="padding-top: 1.5rem; padding-bottom: 3.5rem;">
      <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2rem; font-weight: 800; color: var(--gray-900);">Shopping Cart</h1>
        <span style="color: var(--gray-500); font-size: 0.95rem;">Review your items before proceeding to checkout.</span>
      </div>

      <div id="cart-content-container">
        <!-- Dynamically rendered -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span>&copy; 2026 ShopSphere Store Inc. All rights reserved.</span>
        <div style="display: flex; gap: 1.5rem; font-size: 1.25rem; color: #94a3b8;">
          <i class="fa-brands fa-cc-visa"></i>
          <i class="fa-brands fa-cc-mastercard"></i>
          <i class="fa-brands fa-cc-paypal"></i>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderCartPage();
    });

    function renderCartPage() {
      const summary = API.getCartSummary();
      const container = document.getElementById('cart-content-container');

      if (summary.items.length === 0) {
        container.innerHTML = `
          <div style="background: var(--white); border-radius: var(--radius-xl); border: 1px solid var(--gray-200); padding: 5rem 2rem; text-align: center; max-width: 650px; margin: 2rem auto; box-shadow: var(--shadow-sm);">
            <div style="width: 90px; height: 90px; background: var(--primary-light); color: var(--primary); border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; font-size: 2.75rem; margin: 0 auto 1.5rem;">
              <i class="fa-solid fa-bag-shopping"></i>
            </div>
            <h2 style="font-size: 1.75rem; font-weight: 800; color: var(--gray-900); margin-bottom: 0.5rem;">Your Cart is Empty</h2>
            <p style="color: var(--gray-500); max-width: 380px; margin: 0 auto 1.75rem; font-size: 0.95rem;">
              Looks like you haven't added any products to your bag yet.
            </p>
            <a href="products.html" class="btn btn-primary btn-lg">
              <i class="fa-solid fa-arrow-left"></i> Start Shopping Now
            </a>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="cart-layout">
          <!-- Cart Table -->
          <div class="cart-card">
            <table class="cart-table">
              <thead>
                <tr>
                  <th style="width: 45%;">Product</th>
                  <th style="width: 15%;">Price</th>
                  <th style="width: 20%;">Quantity</th>
                  <th style="width: 15%;">Subtotal</th>
                  <th style="width: 5%;"></th>
                </tr>
              </thead>
              <tbody>
                ${summary.items.map(it => `
                  <tr>
                    <td>
                      <div class="cart-product">
                        <img src="${it.image}" alt="${it.name}" class="cart-thumb">
                        <div>
                          <span class="cart-product-cat">${it.category_name || ''}</span>
                          <h4 class="cart-product-title">
                            <a href="product-detail.html?slug=${it.slug}">${it.name}</a>
                          </h4>
                        </div>
                      </div>
                    </td>
                    <td><span style="font-weight: 600; color: var(--gray-800);">$${it.price}</span></td>
                    <td>
                      <div class="quantity-control">
                        <button type="button" class="qty-btn" onclick="updateQty(${it.product_id}, 'decrease')">
                          <i class="fa-solid fa-minus" style="font-size: 0.75rem;"></i>
                        </button>
                        <span style="width: 36px; text-align: center; font-weight: 700; font-size: 0.9rem;">${it.quantity}</span>
                        <button type="button" class="qty-btn" onclick="updateQty(${it.product_id}, 'increase')">
                          <i class="fa-solid fa-plus" style="font-size: 0.75rem;"></i>
                        </button>
                      </div>
                    </td>
                    <td><span style="font-weight: 800; color: var(--gray-900); font-size: 1.05rem;">$${(parseFloat(it.price) * it.quantity).toFixed(2)}</span></td>
                    <td>
                      <button type="button" class="cart-remove-btn" onclick="removeItem(${it.product_id})" title="Remove item">
                        <i class="fa-regular fa-trash-can"></i>
                      </button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--gray-200); flex-wrap: wrap; gap: 1rem;">
              <a href="products.html" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Continue Shopping</a>
              <button type="button" class="btn btn-outline" style="color: var(--danger); border-color: var(--danger-light);" onclick="handleClearCart()">
                <i class="fa-solid fa-trash"></i> Clear Cart
              </button>
            </div>
          </div>

          <!-- Order Summary -->
          <aside class="order-summary-box">
            <h3 class="summary-title">Order Summary</h3>
            <div class="summary-row">
              <span>Items Subtotal</span>
              <span style="font-weight: 700; color: var(--gray-800);">$${summary.subtotal}</span>
            </div>
            <div class="summary-row">
              <span>Estimated Shipping</span>
              <span style="font-weight: 700; color: var(--gray-800);">
                ${parseFloat(summary.shipping) === 0 ? '<span style="color: var(--success); font-weight: 700;">FREE</span>' : '$' + summary.shipping}
              </span>
            </div>
            <div class="summary-row">
              <span>Estimated Tax (5%)</span>
              <span style="font-weight: 700; color: var(--gray-800);">$${summary.tax}</span>
            </div>
            <div class="summary-row total-row">
              <span>Grand Total</span>
              <span style="color: var(--primary);">$${summary.total}</span>
            </div>

            ${parseFloat(summary.subtotal) < 50 ? `
              <div style="background: var(--accent-light); color: #92400e; padding: 0.65rem 0.85rem; border-radius: var(--radius-md); font-size: 0.8rem; margin: 1.25rem 0; font-weight: 500;">
                <i class="fa-solid fa-truck-fast"></i> Add items worth <strong>$${(50 - parseFloat(summary.subtotal)).toFixed(2)}</strong> more for <strong>FREE shipping</strong>!
              </div>
            ` : `
              <div style="background: var(--success-light); color: #065f46; padding: 0.65rem 0.85rem; border-radius: var(--radius-md); font-size: 0.8rem; margin: 1.25rem 0; font-weight: 500;">
                <i class="fa-solid fa-circle-check"></i> You have unlocked <strong>Free Express Shipping</strong>!
              </div>
            `}

            <a href="checkout.html" class="btn btn-primary btn-lg btn-block" style="margin-top: 1.25rem;">
              Proceed to Checkout <i class="fa-solid fa-arrow-right"></i>
            </a>

            <div style="text-align: center; margin-top: 1.5rem; color: var(--gray-500); font-size: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
              <i class="fa-solid fa-lock" style="color: var(--success);"></i> Safe & Encrypted 256-Bit Checkout
            </div>
          </aside>
        </div>
      `;
    }

    function updateQty(productId, action) {
      API.updateCartQuantity(productId, action);
      renderCartPage();
    }

    function removeItem(productId) {
      API.removeFromCart(productId);
      showToast('Item removed from cart', 'info');
      renderCartPage();
    }

    function handleClearCart() {
      if (confirm('Are you sure you want to clear your cart?')) {
        API.clearCart();
        showToast('Cart cleared', 'info');
        renderCartPage();
      }
    }
  </script>
</body>
</html>
