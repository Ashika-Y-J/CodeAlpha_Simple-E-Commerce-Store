<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | ShopSphere</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <div class="header-main">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon"><i class="fa-solid fa-shapes"></i></div>
          <span>Shop<span class="sphere">Sphere</span></span>
        </a>
        <div class="header-actions" style="margin-left: auto;">
          <a href="index.html" class="action-link"><i class="fa-solid fa-house"></i> Home</a>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="auth-wrapper" style="max-width: 540px;">
        <div class="auth-card">
          
          <div class="auth-header">
            <div class="brand-icon" style="width: 46px; height: 46px; font-size: 1.35rem; margin: 0 auto 1rem;">
              <i class="fa-solid fa-shapes"></i>
            </div>
            <h1 class="auth-title">Create an Account</h1>
            <p class="auth-subtitle">Join ShopSphere to enjoy express checkout and tracking</p>
          </div>

          <form id="register-form">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">First Name *</label>
                <input type="text" id="reg-fname" class="form-input" placeholder="Alex" required>
              </div>
              <div class="form-group">
                <label class="form-label">Last Name *</label>
                <input type="text" id="reg-lname" class="form-input" placeholder="Morgan" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Username *</label>
              <input type="text" id="reg-username" class="form-input" placeholder="Choose a username" required>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Email Address *</label>
                <input type="email" id="reg-email" class="form-input" placeholder="alex@example.com" required>
              </div>
              <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="text" id="reg-phone" class="form-input" placeholder="+1 (555) 000-0000">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Password *</label>
                <input type="password" id="reg-pass" class="form-input" placeholder="Min 6 characters" minlength="6" required>
              </div>
              <div class="form-group">
                <label class="form-label">Confirm Password *</label>
                <input type="password" id="reg-confirm-pass" class="form-input" placeholder="Repeat password" required>
              </div>
            </div>

            <button type="submit" id="reg-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
              <i class="fa-solid fa-user-plus"></i> Complete Registration
            </button>
          </form>

          <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--gray-200); font-size: 0.9rem; color: var(--gray-600);">
            Already have an account? 
            <a href="login.html" style="color: var(--primary); font-weight: 700;">Sign In</a>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('reg-pass').value;
      const p2 = document.getElementById('reg-confirm-pass').value;

      if (p1 !== p2) {
        showToast('Passwords do not match.', 'danger');
        return;
      }

      const btn = document.getElementById('reg-btn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';

      const userData = {
        first_name: document.getElementById('reg-fname').value,
        last_name: document.getElementById('reg-lname').value,
        username: document.getElementById('reg-username').value,
        email: document.getElementById('reg-email').value,
        phone: document.getElementById('reg-phone').value,
        password: p1
      };

      try {
        const res = await API.register(userData);
        showToast(res.message || 'Account created successfully!', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      } catch (err) {
        showToast(err.message || 'Registration failed', 'danger');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Complete Registration';
      }
    });
  </script>
</body>
</html>
